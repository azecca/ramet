name: ci

on:
  push:
    branches: [main]
  pull_request:

# Checks read the code and nothing more, pull requests from forks included.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The crate's rust-version, so CI verifies the MSRV rather than whatever
      # `stable` happens to be today.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09
        with:
          toolchain: "1.98"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The integration fixtures build real git repositories and commit in
      # them. A developer machine has an identity configured; a runner does not.
      - name: Give git an identity for the test fixtures
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid

      - name: Tests
        run: cargo test --locked

      - name: Clippy, pedantic, zero warnings
        run: cargo clippy --all-targets
        env:
          CARGO_BUILD_WARNINGS: deny

      - name: Formatting
        run: cargo fmt --check

      - name: Documentation
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
